<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Offline – Cuicuit</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
					sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.container {
				background: white;
				border-radius: 12px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
				padding: 40px;
				max-width: 500px;
				text-align: center;
			}

			h1 {
				font-size: 28px;
				margin-bottom: 16px;
				color: #333;
			}

			p {
				font-size: 16px;
				color: #666;
				margin-bottom: 24px;
				line-height: 1.6;
			}

			.icon {
				font-size: 64px;
				margin-bottom: 24px;
			}

			.button {
				background: #667eea;
				color: white;
				border: none;
				padding: 12px 24px;
				border-radius: 6px;
				font-size: 16px;
				cursor: pointer;
				transition: background 0.3s;
			}

			.button:hover {
				background: #5568d3;
			}

			.hint {
				font-size: 14px;
				color: #999;
				margin-top: 24px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="icon">📡</div>
			<h1>You're Offline</h1>
			<p>
				It looks like you've lost your internet connection. Some features of Cuicuit require an
				active connection.
			</p>
			<p>
				Cached pages within the app should still be accessible. Check back once you're connected!
			</p>
			<button class="button" onclick="location.href = '/recipes'">Go to Recipes</button>
			<div class="hint">
				<p>This page was served from your device's cache.</p>
			</div>
		</div>
	</body>
</html>
