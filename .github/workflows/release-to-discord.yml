# This action listens for new releases and sends a message to Cuicuit's
# Discord #releases channel to notify everyone of the new release.
# See https://github.com/marketplace/actions/github-releases-to-discord

on:
  release:
    types: [published]
# Uncomment to test manually:
#   workflow_dispatch:
#     inputs:
#       release_name:
#         description: Release title to post
#         required: true
#       release_body:
#         description: Release notes body to post
#         required: true
#       release_html_url:
#         description: Release URL to link in Discord
#         required: false

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          color: '16447989' # Cuicuit creme background #faf9f5 in decimal
          username: 'Cuicuit Release Bot'
          avatar_url: 'https://cdn.discordapp.com/avatars/1563645674300514354/2a6a03f3f9bd0c827b55a4aadb7edd12.webp?size=240'
          content: '@everyone New release published!'
          reduce_headings: true
# Uncomment this too to test manually, indent under `with:`:
#   release_name: ${{ inputs.release_name }}
#   release_body: ${{ inputs.release_body }}
#   release_html_url: ${{ inputs.release_html_url }}
